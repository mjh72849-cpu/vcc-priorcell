[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vcc-priorcell"
version = "0.1.0"
description = "Prior-aware, context-conditioned perturbation model architecture for VCC"
requires-python = ">=3.10"
dependencies = ["torch>=2.1"]

[project.optional-dependencies]
dev = ["pytest>=7.4", "ruff>=0.4"]
vocabulary = ["h5py>=3.8", "numpy>=1.24"]
training = ["h5py>=3.8", "numpy>=1.24", "scipy>=1.10", "anndata>=0.10"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
